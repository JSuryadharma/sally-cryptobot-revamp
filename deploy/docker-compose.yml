# Production stack for a self-hosted server: app + Postgres + Caddy (automatic HTTPS).
# Step-by-step guide: docs/DEPLOY-SERVER.md
#
#   cd deploy && cp .env.server.example .env   # then fill it in
#   docker compose up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). Postgres and the
# app stay on the private Docker network.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3300"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/sallycryptobot}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      # cron-job.org is the only scheduler; the built-in timer stays off.
      ENGINE_LOCAL_LOOP: ${ENGINE_LOCAL_LOOP:-off}
    depends_on:
      db:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: sallycryptobot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sallycryptobot"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
